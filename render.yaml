services:
  - type: web
    name: hojas-de-pallet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_PASSWORD
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: SENDER_ADDRESS
        sync: false
      - key: SENDER_CITY
        sync: false
      - key: SENDER_PHONE
        sync: false
